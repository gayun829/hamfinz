name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # .fvmrc와 같은 버전으로 맞춘다 — 로컬이 푼 pubspec.lock을 CI가 그대로 쓴다.
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Functions 순수 로직 테스트 — 외부 패키지 없이 node:test로 돈다.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test functions/*.test.js
